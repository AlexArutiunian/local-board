[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-board"
version = "0.4.0"
description = "Realtime collaborative whiteboard with rooms, Apple Pencil ink, selection and image objects"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_board = [
  "web/*.html",
  "web/assets/css/*.css",
  "web/assets/js/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
