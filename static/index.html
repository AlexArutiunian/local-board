<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f7f7f8" />
  <title>Доска</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="tool-group">
        <button class="tool active" data-tool="pen" title="Ручка">✎</button>
        <button class="tool" data-tool="eraser" title="Ластик">⌫</button>
        <button class="tool" data-tool="pan" title="Перемещение">✋</button>
      </div>

      <div class="tool-group">
        <button class="color active" data-color="#111111" style="--c:#111111" aria-label="Чёрный"></button>
        <button class="color" data-color="#2563eb" style="--c:#2563eb" aria-label="Синий"></button>
        <button class="color" data-color="#dc2626" style="--c:#dc2626" aria-label="Красный"></button>
        <button class="color" data-color="#16a34a" style="--c:#16a34a" aria-label="Зелёный"></button>
      </div>

      <div class="tool-group width-group">
        <input id="width" type="range" min="1" max="18" step="1" value="4" />
        <span id="widthLabel">4</span>
      </div>

      <div class="tool-group">
        <button id="undo" title="Отменить">↶</button>
        <button id="redo" title="Вернуть">↷</button>
        <button id="fit" title="Вернуть масштаб">100%</button>
      </div>

      <div class="spacer"></div>

      <div class="tool-group">
        <button id="export" title="Скачать PNG">PNG</button>
        <button id="clear" class="danger" title="Очистить">Очистить</button>
      </div>
    </header>

    <main id="stage">
      <canvas id="board"></canvas>
      <div id="status">Загрузка…</div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
