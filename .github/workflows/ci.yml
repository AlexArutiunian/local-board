name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Python syntax
        run: python -m compileall -q src tests

      - name: Python tests
        run: pytest -q

      - name: JavaScript syntax
        run: |
          for file in src/local_board/web/assets/js/*.js; do
            node --check "$file"
          done

      - name: JavaScript unit tests
        run: |
          for file in tests/js/*.mjs; do
            node --experimental-default-type=module "$file"
          done
