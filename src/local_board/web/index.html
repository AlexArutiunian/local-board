<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f5f5f4" />
  <title>Local Board</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="На главную">
        <span class="brand-mark"></span>
        <div>
          <strong>Local Board</strong>
          <span id="boardName" class="board-name">room</span>
        </div>
      </a>

      <div class="topbar-actions">
        <button id="shareRoom" class="share-room" type="button" title="Скопировать ссылку на комнату">Поделиться</button>
        <div class="presence" aria-live="polite">
          <span id="connectionDot" class="presence-dot offline"></span>
          <span id="connectionText">Подключение…</span>
          <span class="separator">•</span>
          <span id="participants">0 участников</span>
        </div>
      </div>
    </header>

    <main id="stage">
      <canvas id="board" aria-label="Совместная доска"></canvas>

      <div class="toolbar" role="toolbar" aria-label="Инструменты доски">
        <div class="tool-section">
          <button class="tool active" data-tool="pen" title="Ручка" aria-label="Ручка">✎</button>
          <button class="tool" data-tool="eraser" title="Ластик" aria-label="Ластик">⌫</button>
          <button class="tool" data-tool="pan" title="Перемещение" aria-label="Перемещение">✋</button>
        </div>

        <div class="divider"></div>

        <div class="tool-section colors">
          <button class="color active" data-color="#111111" style="--c:#111111" aria-label="Чёрный"></button>
          <button class="color" data-color="#2563eb" style="--c:#2563eb" aria-label="Синий"></button>
          <button class="color" data-color="#dc2626" style="--c:#dc2626" aria-label="Красный"></button>
          <button class="color" data-color="#16a34a" style="--c:#16a34a" aria-label="Зелёный"></button>
        </div>

        <div class="divider"></div>

        <label class="width-control" title="Толщина линии">
          <input id="width" type="range" min="1" max="18" step="1" value="4" />
          <span id="widthLabel">4</span>
        </label>

        <div class="divider"></div>

        <div class="tool-section">
          <button id="undo" title="Отменить" aria-label="Отменить">↶</button>
          <button id="redo" title="Вернуть" aria-label="Вернуть">↷</button>
          <button id="goToLast" title="Перейти к последнему месту письма" aria-label="К последнему месту письма" disabled>⌖</button>
          <button id="resetView" title="Сбросить вид">100%</button>
          <button id="exportPng" title="Сохранить PNG">PNG</button>
          <button id="clearBoard" class="danger" title="Очистить доску">Очистить</button>
        </div>
      </div>

      <div id="offlineBanner" class="offline-banner hidden">
        Соединение потеряно. Изменения сохраняются локально и будут отправлены после переподключения.
      </div>
    </main>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
